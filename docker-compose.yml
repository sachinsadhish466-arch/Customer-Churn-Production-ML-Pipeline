services:

  api:
    build: .
    container_name: customer-churn-api-container

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"
        ]

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: unless-stopped


  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: customer-churn-streamlit-container

    ports:
      - "8501:8501"

    environment:
      API_URL: "http://api:8000"

    depends_on:
      - api

    restart: unless-stopped