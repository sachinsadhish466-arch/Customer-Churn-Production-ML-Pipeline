# ============================================================
# Customer Churn Production ML Pipeline
# Verified AWS Deployment Configuration
# ============================================================

project:
  name: customer-churn-production-ml-pipeline
  application: customer-churn-api

# ------------------------------------------------------------
# AWS Account / Region
# ------------------------------------------------------------

aws:
  region: "ap-south-1"
  account_id: "<AWS_ACCOUNT_ID>"

# ------------------------------------------------------------
# Amazon ECR
# ------------------------------------------------------------

ecr:
  repository_name: "customer-churn-production-ml-pipeline"

  image:
    tag: "latest"

# ------------------------------------------------------------
# Amazon ECS Fargate
# ------------------------------------------------------------

ecs:
  cluster_name: "customer-churn-production-cluster"

  service_name: "customer-churn-api-service"

  task_definition_family: "customer-churn-api"

  launch_type: "FARGATE"

  cpu: 512

  memory: 1024

  desired_count: 1

  container:
    name: "customer-churn-api"
    port: 8000

# ------------------------------------------------------------
# Application
# ------------------------------------------------------------

application:
  container_port: 8000

  health_check:
    path: "/ready"
    interval_seconds: 30
    timeout_seconds: 10
    retries: 3
    start_period_seconds: 60

# ------------------------------------------------------------
# Amazon CloudWatch
# ------------------------------------------------------------

cloudwatch:
  log_group: "/ecs/customer-churn-api"

  log_stream_prefix: "ecs"

# ------------------------------------------------------------
# Deployment
# ------------------------------------------------------------

deployment:
  strategy: "rolling"

  minimum_healthy_percent: 100

  maximum_percent: 200

  automatic_rollback: false

# ------------------------------------------------------------
# Security
# ------------------------------------------------------------

security:
  secrets_in_repository: false

  public_task_ip_for_demo: true

  https_enabled: false

  private_database_access: true

# ------------------------------------------------------------
# Environment
# ------------------------------------------------------------

environment:
  name: "portfolio-demo"

  python_version: "3.10"

  application_framework: "FastAPI"

  container_runtime: "Docker"

# ------------------------------------------------------------
# Important Scope
# ------------------------------------------------------------

scope:
  deployment_status: "verified"

  deployment_type: "portfolio-demonstration"

  stable_public_endpoint: false

  api_gateway: false

  application_load_balancer: false

  s3_artifact_storage: false

  managed_mlflow_registry: false

  automatic_production_deployment: false